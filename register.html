<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Créer un compte Housing's YQD">

    <title>
        Créer un compte | Housing's YQD
    </title>

    <link rel="stylesheet"
          href="style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body class="auth-page">


<div class="auth-wrapper">


    <section class="auth-visual">

        <a href="index.html"
           class="brand">

            <div class="brand-logo">
                <i class="fa-solid fa-building"></i>
            </div>

            <div class="brand-text">
                <strong>Housing's YQD</strong>
                <span>IMMOBILIER</span>
            </div>

        </a>


        <div class="auth-visual-content">

            <span class="auth-kicker">
                BIENVENUE
            </span>

            <h1>
                Créez votre espace personnel.
            </h1>

            <p>
                Accédez à votre tableau de bord,
                aux investissements, à l'historique,
                au parrainage et à l'assistance.
            </p>

        </div>

    </section>


    <section class="auth-form-section">


        <div class="auth-form-container">


            <a href="index.html"
               class="auth-back">

                <i class="fa-solid fa-arrow-left"></i>
                Accueil

            </a>


            <span class="page-eyebrow">
                INSCRIPTION
            </span>


            <h2>
                Créer un compte
            </h2>


            <p class="auth-description">
                Remplissez les informations ci-dessous.
            </p>


            <div id="registerMessage"
                 class="form-message">
            </div>


            <form id="registerForm"
                  autocomplete="on">


                <div class="form-group">

                    <label for="fullName">
                        Nom complet
                    </label>

                    <div class="input-icon-wrapper">

                        <i class="fa-regular fa-user"></i>

                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            class="form-control"
                            placeholder="Nom et prénom"
                            autocomplete="name"
                            required>

                    </div>

                </div>


                <div class="form-group">

                    <label for="phone">
                        Numéro de téléphone
                    </label>

                    <div class="phone-input">

                        <span class="phone-prefix">
                            +225
                        </span>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            class="form-control"
                            placeholder="0700000000"
                            autocomplete="tel"
                            inputmode="numeric"
                            required>

                    </div>

                </div>


                <div class="form-group">

                    <label for="password">
                        Mot de passe
                    </label>

                    <div class="password-input-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Minimum 6 caractères"
                            autocomplete="new-password"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            data-password-target="password"
                            aria-label="Afficher le mot de passe">

                            <i class="fa-regular fa-eye"></i>

                        </button>

                    </div>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirmer le mot de passe
                    </label>

                    <div class="password-input-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            class="form-control"
                            placeholder="Confirmez votre mot de passe"
                            autocomplete="new-password"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            data-password-target="confirmPassword"
                            aria-label="Afficher le mot de passe">

                            <i class="fa-regular fa-eye"></i>

                        </button>

                    </div>

                </div>


                <div class="form-group">

                    <label for="referralCode">
                        Code d'invitation
                        <span class="optional-text">
                            (facultatif)
                        </span>
                    </label>

                    <div class="input-icon-wrapper">

                        <i class="fa-solid fa-user-group"></i>

                        <input
                            type="text"
                            id="referralCode"
                            name="referralCode"
                            class="form-control"
                            placeholder="Exemple : YQDABC123">

                    </div>

                </div>


                <button
                    type="submit"
                    class="form-submit"
                    id="registerButton">

                    <span>
                        Créer mon compte
                    </span>

                    <i class="fa-solid fa-arrow-right"></i>

                </button>


            </form>


            <div class="auth-switch">

                Vous avez déjà un compte ?

                <a href="login.html">
                    Se connecter
                </a>

            </div>


        </div>

    </section>


</div>


<script src="script.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        /* Préremplissage du code de parrainage */

        const params =
            new URLSearchParams(
                window.location.search
            );

        const referralFromUrl =
            params.get("ref");

        if (referralFromUrl) {
            document.getElementById(
                "referralCode"
            ).value =
                referralFromUrl;
        }


        /* Afficher / masquer mot de passe */

        document.querySelectorAll(
            "[data-password-target]"
        ).forEach(
            function (button) {

                button.addEventListener(
                    "click",
                    function () {

                        const input =
                            document.getElementById(
                                button.dataset
                                    .passwordTarget
                            );

                        const icon =
                            button.querySelector("i");

                        if (
                            input.type ===
                            "password"
                        ) {
                            input.type = "text";
                            icon.className =
                                "fa-regular fa-eye-slash";
                        } else {
                            input.type =
                                "password";
                            icon.className =
                                "fa-regular fa-eye";
                        }
                    }
                );
            }
        );


        /* INSCRIPTION */

        document.getElementById(
            "registerForm"
        ).addEventListener(
            "submit",
            function (event) {

                event.preventDefault();

                const fullName =
                    document.getElementById(
                        "fullName"
                    ).value.trim();

                const phone =
                    document.getElementById(
                        "phone"
                    ).value.trim();

                const password =
                    document.getElementById(
                        "password"
                    ).value;

                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    ).value;

                const referralCode =
                    document.getElementById(
                        "referralCode"
                    ).value.trim();

                const messageBox =
                    document.getElementById(
                        "registerMessage"
                    );

                const button =
                    document.getElementById(
                        "registerButton"
                    );

                button.disabled = true;

                const result =
                    registerUser({
                        fullName:
                            fullName,

                        phone:
                            phone,

                        password:
                            password,

                        confirmPassword:
                            confirmPassword,

                        referralCode:
                            referralCode
                    });

                messageBox.textContent =
                    result.message;

                messageBox.className =
                    "form-message " +
                    (
                        result.success
                            ? "success"
                            : "error"
                    );

                if (!result.success) {
                    button.disabled =
                        false;

                    return;
                }

                button.innerHTML =
                    '<i class="fa-solid fa-check"></i> Compte créé';

                setTimeout(
                    function () {
                        window.location.href =
                            "dashboard.html";
                    },
                    700
                );
            }
        );

    }
);

</script>


</body>
</html>
